url: https://pedrobtz.github.io/nanowasm/
template:
  bootstrap: 5

# Development mode follows the version: 0.0.0.9000 (never released) builds
# the site at the root, marked "unreleased"; a release (0.1.0) builds at the
# root; a later development version (0.1.0.9000) builds into dev/, leaving
# the released docs at the root. The deploy step keeps both (clean: false in
# pkgdown.yaml).
development:
  mode: auto

articles:
  - title: Articles
    navbar: ~
    contents:
      - nanowasm
      - articles/examples

reference:
  - title: Modules
    desc: Load and inspect WebAssembly modules.
    contents:
      - wasm_module
      - wasm_exports
  - title: Instances and calls
    desc: Instantiate a module and call its functions.
    contents:
      - wasm_instantiate
      - wasm_global
      - wasm_limits
  - title: Linear memory
    desc: Move data between R and an instance's memory.
    contents:
      - wasm_memory
  - title: Imports
    desc: Let a module call R.
    contents:
      - wasm_func
  - title: Errors
    contents:
      - nanowasm-conditions
  - title: Package
    contents:
      - nanowasm-package
