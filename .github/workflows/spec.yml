# Runs a subset of the WebAssembly spec test suite through nanowasm's R API
# (tools/spec/). CI only: neither the suite nor the runner ships in the
# package.
on:
  push:
    branches: [main, master]
  pull_request:

name: spec

permissions: read-all

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::jsonlite, local::.
          needs: check
      - name: Run the spec tests
        run: tools/spec/run.sh "$RUNNER_TEMP/spec"
