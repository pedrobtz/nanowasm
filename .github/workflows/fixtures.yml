# The .wasm fixtures are committed so that tests and examples need no wabt.
# This job rebuilds them from their .wat sources with the pinned wabt and
# fails if the committed binaries differ, so a .wat edit can't be merged
# without its binary (or the other way round).
on:
  push:
    branches: [main, master]
  pull_request:

name: fixtures

permissions: read-all

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild the fixtures
        run: tools/build-fixtures.sh
      - name: Committed binaries match their sources
        run: |
          status="$(git status --porcelain -- '*.wasm')"
          if [ -n "$status" ]; then
            echo "::error::.wasm fixtures differ from their .wat sources; run tools/build-fixtures.sh and commit the result."
            echo "$status"
            git diff --stat -- '*.wasm'
            exit 1
          fi
